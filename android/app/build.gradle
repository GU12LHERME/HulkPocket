plugins { id 'com.android.application' version '8.7.3' }
android {
 namespace 'com.hulkpocket.diagnostic'
 compileSdk 35
 ndkVersion '28.2.13676358'
 buildFeatures { buildConfig true }
 defaultConfig {
  def revision = providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()
  buildConfigField 'String', 'PREVIEW_REVISION', '"' + revision + '"'
  def vkPreview = providers.gradleProperty('hulkVulkanPreview').orElse('false').get() == 'true'
  buildConfigField 'boolean', 'VULKAN_PREVIEW', vkPreview.toString()
  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', "-DHULK_ENABLE_VULKAN_PREVIEW=${vkPreview ? 'ON' : 'OFF'}" } }
  applicationId 'com.hulkpocket.diagnostic'
  minSdk 29
  targetSdk 35
  versionCode 5
  versionName '0.3.2-playable-preview-dev'
  ndk { abiFilters 'arm64-v8a' }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}

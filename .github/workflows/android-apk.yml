name: Android native bridge APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'native/**'
      - 'tools/export_hulk_preview.py'
      - 'third_party/xboxxberecomp/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pinned SDK CPU context
        run: |
          mkdir -p android/app/src/main/cpp/sdk/cpu
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/TGP482/XboxXBERecomp/767a81837fba2d86913f6af81a10b33661d35518/runtime/cpu/x86_context.h -o android/app/src/main/cpp/sdk/cpu/x86_context.h
          test "$(git hash-object android/app/src/main/cpp/sdk/cpu/x86_context.h)" = a02e10b8e2069920529d79d1f4e2413c73cb5f10
      - name: Validate local preview package metadata
        run: python3 tools/export_hulk_preview.py --self-test
      - name: Build APK with bounded retries
        run: |
          for attempt in 1 2 3; do
            if gradle -p android --no-daemon assembleDebug; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 60)); fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: HulkPocket-0.3.1-playable-preview-dev
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: XboxXBE-Recomp portable game code Android ARM64
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xbe-recomp-arm64.yml'
      - 'native/**'
      - 'tools/**'
permissions:
  contents: read

jobs:
  portable-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install NDK and host compiler
        run: |
          set -euo pipefail
          sdkmanager 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Verify Hulk disc-region detection with synthetic Xbox headers
        run: python3 -m unittest discover -s tools -p 'test_xbe_info.py' -v
      - name: Validate native ARM64 cooperative stack switching
        run: |
          set -euo pipefail
          sudo apt-get install -y g++-aarch64-linux-gnu qemu-user
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -static \
            -I native native/test_aarch64_context.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-fiber-linux-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-fiber-linux-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native native/test_native_fiber.cpp native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-fiber-lifecycle-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-fiber-lifecycle-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native native/test_xbox_fiber_scheduler.cpp \
            native/xbox_fiber_scheduler.cpp native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-fiber-dispatcher-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-fiber-dispatcher-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -static \
            -I native native/test_xbox_guest_fiber_state.cpp \
            -o "$RUNNER_TEMP/hulk-guest-fiber-registers-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-guest-fiber-registers-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native native/test_xbox_fiber_bridge.cpp \
            native/xbox_fiber_scheduler.cpp native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-guest-fiber-bridge-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-guest-fiber-bridge-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -static \
            -I native native/test_xbox_guest_address_space.cpp \
            native/xbox_guest_address_space.cpp \
            -o "$RUNNER_TEMP/hulk-guest-address-space-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-guest-address-space-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -static \
            -I native native/test_xbe_image_memory_loader.cpp \
            native/xbe_image_memory_loader.cpp native/xbox_guest_address_space.cpp \
            -o "$RUNNER_TEMP/hulk-xbe-image-loader-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-xbe-image-loader-arm64"
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndk/aarch64-linux-android29-clang++" -fPIC -shared \
            -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            native/aarch64_context.S -o "$RUNNER_TEMP/libhulkpocket-fiber-android.so"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/libhulkpocket-fiber-android.so" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC -shared \
            -Wall -Wextra -Werror -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            -I native native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/libhulkpocket-native-fiber-android.so"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/libhulkpocket-native-fiber-android.so" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC -shared \
            -Wall -Wextra -Werror -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            -I native native/xbox_fiber_scheduler.cpp native/native_fiber.cpp \
            native/aarch64_context.S -o "$RUNNER_TEMP/libhulkpocket-fiber-dispatcher-android.so"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/libhulkpocket-fiber-dispatcher-android.so" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native \
            -c native/test_xbox_guest_fiber_state.cpp \
            -o "$RUNNER_TEMP/hulk-guest-fiber-registers-android.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/hulk-guest-fiber-registers-android.o" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native \
            -c native/test_xbox_fiber_bridge.cpp \
            -o "$RUNNER_TEMP/hulk-guest-fiber-bridge-android.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/hulk-guest-fiber-bridge-android.o" | grep -q AArch64
          echo "ARM64 fiber context switching passed suspend/resume under QEMU and linked with Android NDK." >> "$GITHUB_STEP_SUMMARY"
      - name: Test actual XboxXBERecomp SDK X86Context against native ARM64 fiber adapter
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/TGP482/XboxXBERecomp.git "$RUNNER_TEMP/xbe-sdk"
          git -C "$RUNNER_TEMP/xbe-sdk" rev-parse HEAD | tee "$RUNNER_TEMP/xbe-sdk-commit.txt"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_xbe_sdk_fiber_adapter.cpp native/xbox_fiber_scheduler.cpp \
            native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/xbe-sdk-fiber-test-arm64"
          qemu-aarch64 "$RUNNER_TEMP/xbe-sdk-fiber-test-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_hulk_xdk_fiber_hook.cpp native/xbox_fiber_scheduler.cpp \
            native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-xdk-switch-hook-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-xdk-switch-hook-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_hulk_xdk_fiber_bootstrap.cpp native/xbox_fiber_scheduler.cpp \
            native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-xdk-bootstrap-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-xdk-bootstrap-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_hulk_guest_memory_fiber.cpp \
            native/xbox_guest_address_space.cpp native/xbox_fiber_scheduler.cpp \
            native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-real-guest-memory-fiber-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-real-guest-memory-fiber-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_xbe_sdk_icall_binding.cpp native/xbox_fiber_scheduler.cpp \
            native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/xbe-sdk-icall-binding-arm64"
          qemu-aarch64 "$RUNNER_TEMP/xbe-sdk-icall-binding-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_portable_xbe_dispatch.cpp native/portable_xbe_dispatch.cpp \
            native/xbox_fiber_scheduler.cpp native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/portable-xbe-dispatch-arm64"
          qemu-aarch64 "$RUNNER_TEMP/portable-xbe-dispatch-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -pthread -static -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_portable_xbe_cpu_services.cpp \
            native/portable_xbe_cpu_services.cpp native/portable_xbe_dispatch.cpp \
            -o "$RUNNER_TEMP/portable-xbe-cpu-services-arm64"
          qemu-aarch64 "$RUNNER_TEMP/portable-xbe-cpu-services-arm64"
          # An actual native ELF module exports the same symbols the
          # Windows SDK expects from generated game-code DLLs.
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_portable_xbe_image_module.cpp \
            -o "$RUNNER_TEMP/libsynthetic-xbe-code-host.so"
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_portable_xbe_image.cpp native/portable_xbe_image.cpp \
            native/portable_xbe_dispatch.cpp -ldl \
            -o "$RUNNER_TEMP/portable-xbe-elf-loader-host"
          "$RUNNER_TEMP/portable-xbe-elf-loader-host" "$RUNNER_TEMP/libsynthetic-xbe-code-host.so"
          # End-to-end integration: a synthetic XBE section is mapped into
          # actual reserved Xbox guest memory, then read by an ELF native
          # guest function using the SDK's X86Context/entrypoint ABI.
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_xbe_guest_memory_module.cpp \
            -o "$RUNNER_TEMP/libsynthetic-xbe-memory-host.so"
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_xbe_image_dispatch.cpp native/hulk_xbe_preflight.cpp \
            native/xbe_image_memory_loader.cpp native/xbox_guest_address_space.cpp \
            native/portable_xbe_image.cpp native/portable_xbe_dispatch.cpp -ldl \
            -o "$RUNNER_TEMP/test-xbe-image-dispatch-host"
          "$RUNNER_TEMP/test-xbe-image-dispatch-host" "$RUNNER_TEMP/libsynthetic-xbe-memory-host.so"
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/hulk_xbe_local_diagnostic.cpp native/hulk_xbe_preflight.cpp \
            native/xbe_image_memory_loader.cpp native/xbox_guest_address_space.cpp \
            native/portable_xbe_image.cpp native/portable_xbe_dispatch.cpp -ldl \
            -o "$RUNNER_TEMP/hulk-xbe-local-diagnostic"
          # The diagnostic does not run a guest image and never
          # prints bytes from the private user-provided executable.
          diagnostic_help=$("$RUNNER_TEMP/hulk-xbe-local-diagnostic" 2>&1 || :)
          printf '%s\n' "$diagnostic_help" | grep -q 'usage: hulk_xbe_local_diagnostic'
          python3 - "$RUNNER_TEMP/synthetic-private-xbe.bin" <<'PY'
          import struct
          import sys
          data = bytearray(0x800)
          data[:4] = b"XBEH"
          base = 0x10000
          def put(offset, value):
              struct.pack_into("<I", data, offset, value)
          put(0x104, base)
          put(0x108, 0x400)
          put(0x10C, 0x310000)
          put(0x118, base + 0x180)
          put(0x11C, 1)
          put(0x120, base + 0x240)
          put(0x128, 0x300010 ^ 0xA8FC57AB)
          put(0x158, 0x300020 ^ 0x5B6D40B6)
          put(0x188, 0x56550039)
          put(0x240, 4)
          put(0x244, 0x300000)
          put(0x248, 0x1000)
          put(0x24c, 0x600)
          put(0x250, 0x100)
          put(0x650, 0x87654321)
          with open(sys.argv[1], "wb") as file:
              file.write(data)
          PY
          "$RUNNER_TEMP/hulk-xbe-local-diagnostic" \
            "$RUNNER_TEMP/synthetic-private-xbe.bin" \
            "$RUNNER_TEMP/libsynthetic-xbe-memory-host.so" |
            grep -q 'Module match: PASS'
          # Change the XBE's guest entry while keeping a valid retail
          # encoding: a mismatched function map must fail preflight.
          python3 - "$RUNNER_TEMP/synthetic-private-xbe.bin" \
            "$RUNNER_TEMP/synthetic-mismatched-xbe.bin" <<'PY'
          import struct
          import sys
          with open(sys.argv[1], "rb") as file:
              data = bytearray(file.read())
          struct.pack_into("<I", data, 0x128, 0x300020 ^ 0xA8FC57AB)
          with open(sys.argv[2], "wb") as file:
              file.write(data)
          PY
          if "$RUNNER_TEMP/hulk-xbe-local-diagnostic" \
            "$RUNNER_TEMP/synthetic-mismatched-xbe.bin" \
            "$RUNNER_TEMP/libsynthetic-xbe-memory-host.so" > /dev/null 2>&1; then
            echo "XBE compatibility preflight accepted mismatched code entry!" >&2
            exit 1
          fi
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            -c native/test_xbe_sdk_fiber_adapter.cpp \
            -o "$RUNNER_TEMP/xbe-sdk-fiber-test-android.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/xbe-sdk-fiber-test-android.o" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            -c native/test_hulk_xdk_fiber_hook.cpp \
            -o "$RUNNER_TEMP/hulk-xdk-switch-hook-android.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/hulk-xdk-switch-hook-android.o" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            -c native/test_hulk_xdk_fiber_bootstrap.cpp \
            -o "$RUNNER_TEMP/hulk-xdk-bootstrap-android.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/hulk-xdk-bootstrap-android.o" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            -c native/test_xbe_sdk_icall_binding.cpp \
            -o "$RUNNER_TEMP/xbe-sdk-icall-binding-android.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/xbe-sdk-icall-binding-android.o" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            -c native/test_portable_xbe_dispatch.cpp \
            -o "$RUNNER_TEMP/portable-xbe-dispatch-test-android.o"
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC -shared \
            -Wall -Wextra -Werror -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/portable_xbe_dispatch.cpp native/portable_xbe_image.cpp \
            native/portable_xbe_cpu_services.cpp native/hulk_xbe_preflight.cpp \
            native/xbox_guest_address_space.cpp \
            native/xbe_image_memory_loader.cpp \
            native/xbox_fiber_scheduler.cpp \
            native/native_fiber.cpp native/aarch64_context.S -ldl \
            -o "$RUNNER_TEMP/libhulkpocket-portable-xbe-dispatch.so"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/libhulkpocket-portable-xbe-dispatch.so" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC -shared \
            -Wall -Wextra -Werror -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_portable_xbe_image_module.cpp \
            -o "$RUNNER_TEMP/libsynthetic-xbe-code-android.so"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/libsynthetic-xbe-code-android.so" | grep -q AArch64
          # Standalone Android ARM64 diagnostic for physical Retroid tests.
          # This is NOT an APK, does not ship game code, and never executes
          # the original Xbox entry point.
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 \
            -Wall -Wextra -Werror -static-libstdc++ \
            -Wl,-z,max-page-size=16384 \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/hulk_xbe_local_diagnostic.cpp native/hulk_xbe_preflight.cpp \
            native/xbe_image_memory_loader.cpp native/xbox_guest_address_space.cpp \
            native/portable_xbe_image.cpp native/portable_xbe_dispatch.cpp -ldl \
            -o "$RUNNER_TEMP/hulk-xbe-local-diagnostic-android-arm64"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/hulk-xbe-local-diagnostic-android-arm64" |
            grep -q AArch64
          "$ndk/llvm-nm" -D -C "$RUNNER_TEMP/libhulkpocket-portable-xbe-dispatch.so" |
            grep -q 'x86_icall(X86Context'
          echo "Portable XboxXBERecomp x86_icall ARM64 ELF shared library linked with Android NDK; synthetic game entry only." >> "$GITHUB_STEP_SUMMARY"
          echo "Tested the actual upstream X86Context guest state with real native AArch64 fiber stack switching." >> "$GITHUB_STEP_SUMMARY"
      - name: Compile actual XboxXBERecomp static recompiler for Linux host
        run: |
          set -euo pipefail
          cmake -S tools/xbe-recompiler-host \
            -B "$RUNNER_TEMP/xbe-recompiler-build" -G Ninja \
            -DXBE_SDK_DIR="$RUNNER_TEMP/xbe-sdk" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/xbe-recompiler-build" \
            --target xbe_recomp_host --parallel 2
          test -x "$RUNNER_TEMP/xbe-recompiler-build/xbe_recomp_host"
          info=$("$RUNNER_TEMP/xbe-recompiler-build/xbe_recomp_host" 2>&1 || :)
          printf '%s\n' "$info" | grep -F 'usage: xbe_recomp'
          echo "Built the actual upstream Xbox XBE-to-C++ recompiler on Linux; no game image processed." >> "$GITHUB_STEP_SUMMARY"
      - name: Recompile actual x86 machine code from synthetic Xbox XBE into ARM64
        run: |
          set -euo pipefail
          python3 tools/create_synthetic_xbe_recompile.py \
            --output-dir "$RUNNER_TEMP/xbe-original-machine-code"
          "$RUNNER_TEMP/xbe-recompiler-build/xbe_recomp_host" \
            "$RUNNER_TEMP/xbe-original-machine-code/synthetic.toml" \
            "$RUNNER_TEMP/xbe-original-machine-code/synthetic.xbe" \
            "$RUNNER_TEMP/xbe-original-machine-code/generated"
          test -s "$RUNNER_TEMP/xbe-original-machine-code/generated/x86_func_mapping.cpp"
          test -s "$RUNNER_TEMP/xbe-original-machine-code/generated/x86_recomp.0.cpp"
          # These are generated from genuine IA-32 instructions by
          # the official tool, not handwritten SDK-style function mocks.
          python3 tools/prepare_xbe_elf.py \
            --sdk "$RUNNER_TEMP/xbe-sdk" \
            --generated "$RUNNER_TEMP/xbe-original-machine-code/generated" \
            --output "$RUNNER_TEMP/xbe-recompiled-real-opcodes"
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 tools/build_xbe_android.py \
            --sdk "$RUNNER_TEMP/xbe-sdk" \
            --generated "$RUNNER_TEMP/xbe-original-machine-code/generated" \
            --ndk-bin "$ndk" \
            --audit-output "$RUNNER_TEMP/actual-recompiler-imports.json" \
            --output "$RUNNER_TEMP/libsynthetic-recompiled-opcodes-android.so"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/libsynthetic-recompiled-opcodes-android.so" | grep -q AArch64
          # Execute the genuine compiler's translation of IA-32
          # instructions on the Linux host through the same SDK
          # guest function dispatch used by the Android runtime.
          clang++ -std=c++20 -O2 -fPIC -shared \
            -Wall -Wextra -Werror -Wno-unused-parameter \
            -Wno-unused-variable -Wl,-z,defs \
            -I "$RUNNER_TEMP/xbe-recompiled-real-opcodes" \
            "$RUNNER_TEMP/xbe-recompiled-real-opcodes/x86_func_mapping.cpp" \
            "$RUNNER_TEMP/xbe-recompiled-real-opcodes/x86_recomp.0.cpp" \
            -o "$RUNNER_TEMP/libsynthetic-recompiled-opcodes-host.so"
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_recompiled_xbe_machine_code.cpp \
            native/xbe_image_memory_loader.cpp native/xbox_guest_address_space.cpp \
            native/portable_xbe_image.cpp native/portable_xbe_dispatch.cpp -ldl \
            -o "$RUNNER_TEMP/run-recompiled-xbe-opcodes-host"
          "$RUNNER_TEMP/run-recompiled-xbe-opcodes-host" \
            "$RUNNER_TEMP/xbe-original-machine-code/synthetic.xbe" \
            "$RUNNER_TEMP/libsynthetic-recompiled-opcodes-host.so"
          # QEMU executes machine code compiled for AArch64, not x86.
          aarch64-linux-gnu-g++ -std=c++20 -O2 -static -pthread \
            -Wall -Wextra -Werror -Wno-unused-parameter -Wno-unused-variable \
            -Wno-missing-attributes \
            -I native -I "$RUNNER_TEMP/xbe-recompiled-real-opcodes" \
            native/test_recompiled_xbe_arm64.cpp \
            native/xbe_image_memory_loader.cpp native/xbox_guest_address_space.cpp \
            native/portable_xbe_dispatch.cpp \
            "$RUNNER_TEMP/xbe-recompiled-real-opcodes/x86_func_mapping.cpp" \
            "$RUNNER_TEMP/xbe-recompiled-real-opcodes/x86_recomp.0.cpp" \

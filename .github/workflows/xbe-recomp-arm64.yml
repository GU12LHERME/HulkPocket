name: XboxXBE-Recomp portable game code Android ARM64
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xbe-recomp-arm64.yml'
      - 'native/**'
      - 'tools/xbe_info.py'
      - 'tools/test_xbe_info.py'
permissions:
  contents: read

jobs:
  portable-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install NDK and host compiler
        run: |
          set -euo pipefail
          sdkmanager 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Verify Hulk disc-region detection with synthetic Xbox headers
        run: python3 -m unittest discover -s tools -p 'test_xbe_info.py' -v
      - name: Validate native ARM64 cooperative stack switching
        run: |
          set -euo pipefail
          sudo apt-get install -y g++-aarch64-linux-gnu qemu-user
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -static \
            -I native native/test_aarch64_context.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-fiber-linux-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-fiber-linux-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native native/test_native_fiber.cpp native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-fiber-lifecycle-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-fiber-lifecycle-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native native/test_xbox_fiber_scheduler.cpp \
            native/xbox_fiber_scheduler.cpp native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-fiber-dispatcher-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-fiber-dispatcher-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -static \
            -I native native/test_xbox_guest_fiber_state.cpp \
            -o "$RUNNER_TEMP/hulk-guest-fiber-registers-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-guest-fiber-registers-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native native/test_xbox_fiber_bridge.cpp \
            native/xbox_fiber_scheduler.cpp native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-guest-fiber-bridge-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-guest-fiber-bridge-arm64"
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndk/aarch64-linux-android29-clang++" -fPIC -shared \
            -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            native/aarch64_context.S -o "$RUNNER_TEMP/libhulkpocket-fiber-android.so"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/libhulkpocket-fiber-android.so" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC -shared \
            -Wall -Wextra -Werror -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            -I native native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/libhulkpocket-native-fiber-android.so"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/libhulkpocket-native-fiber-android.so" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC -shared \
            -Wall -Wextra -Werror -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            -I native native/xbox_fiber_scheduler.cpp native/native_fiber.cpp \
            native/aarch64_context.S -o "$RUNNER_TEMP/libhulkpocket-fiber-dispatcher-android.so"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/libhulkpocket-fiber-dispatcher-android.so" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native \
            -c native/test_xbox_guest_fiber_state.cpp \
            -o "$RUNNER_TEMP/hulk-guest-fiber-registers-android.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/hulk-guest-fiber-registers-android.o" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native \
            -c native/test_xbox_fiber_bridge.cpp \
            -o "$RUNNER_TEMP/hulk-guest-fiber-bridge-android.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/hulk-guest-fiber-bridge-android.o" | grep -q AArch64
          echo "ARM64 fiber context switching passed suspend/resume under QEMU and linked with Android NDK." >> "$GITHUB_STEP_SUMMARY"
      - name: Test actual XboxXBERecomp SDK X86Context against native ARM64 fiber adapter
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/TGP482/XboxXBERecomp.git "$RUNNER_TEMP/xbe-sdk"
          git -C "$RUNNER_TEMP/xbe-sdk" rev-parse HEAD | tee "$RUNNER_TEMP/xbe-sdk-commit.txt"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_xbe_sdk_fiber_adapter.cpp native/xbox_fiber_scheduler.cpp \
            native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/xbe-sdk-fiber-test-arm64"
          qemu-aarch64 "$RUNNER_TEMP/xbe-sdk-fiber-test-arm64"
          aarch64-linux-gnu-g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -static \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_hulk_xdk_fiber_hook.cpp native/xbox_fiber_scheduler.cpp \
            native/native_fiber.cpp native/aarch64_context.S \
            -o "$RUNNER_TEMP/hulk-xdk-switch-hook-arm64"
          qemu-aarch64 "$RUNNER_TEMP/hulk-xdk-switch-hook-arm64"
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            -c native/test_xbe_sdk_fiber_adapter.cpp \
            -o "$RUNNER_TEMP/xbe-sdk-fiber-test-android.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/xbe-sdk-fiber-test-android.o" | grep -q AArch64
          "$ndk/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            -c native/test_hulk_xdk_fiber_hook.cpp \
            -o "$RUNNER_TEMP/hulk-xdk-switch-hook-android.o"
          "$ndk/llvm-readelf" -h "$RUNNER_TEMP/hulk-xdk-switch-hook-android.o" | grep -q AArch64
          echo "Tested the actual upstream X86Context guest state with real native AArch64 fiber stack switching." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout playable Windows port as build input
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/lookingcoding/hulk-ultimate-destruction-recomp-xbox-ver-.git "$RUNNER_TEMP/hulk-recompiled"
          git -C "$RUNNER_TEMP/hulk-recompiled" rev-parse HEAD | tee "$RUNNER_TEMP/upstream-commit.txt"
      - name: Run upstream simulation regression tests on Linux host
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hulk-recompiled"
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -I "$src/src" \
            "$src/tests/simulation.cpp" -o "$RUNNER_TEMP/hulk-simulation-test"
          "$RUNNER_TEMP/hulk-simulation-test"
      - name: Cross-compile game simulation and RCF archive code for Android
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hulk-recompiled"
          bin="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Build actual game-ported source, not only a mock project.
          "$bin/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I "$src/src" \
            -c "$src/src/common/rcf.cpp" -o "$RUNNER_TEMP/hulk-rcf.o"
          cat > "$RUNNER_TEMP/game-port-probe.cpp" <<'CPP'
          #include "common/rcf.h"
          #include "common/simulation.h"
          #include "common/actor_owner_guard.h"
          extern "C" __attribute__((visibility("default")))
          int hulkpocket_game_code_probe() {
              hulk::SimulationClock clock;
              const unsigned ticks = clock.Advance(hulk::SimulationClock::kStep);
              const auto archive_offset = hulk::AlignRcf(1);
              // Real original-Xbox instruction decoder used to prevent the
              // Lightning Strike null-owner crash in the playable Windows port.
              const uint8_t owner_read[] = {0x8B, 0x88, 0xEC, 0x00, 0x00, 0x00};
              const auto plan = hulk::PlanOwnerGuard(owner_read, sizeof(owner_read));
              uint32_t guest_regs[8] = {0x1000, 0, 0, 0, 0, 0, 0, 0};
              const bool guards_null = hulk::OwnerGuardSkips(
                  plan, guest_regs, [](uint32_t) { return uint32_t(0); });
              return int(ticks == 1 && archive_offset == 0x800 &&
                         hulk::SamePath("art/copyright-en.p3d", "ART\\copyright-en.p3d") &&
                         plan.rule == hulk::OwnerGuardRule::OwnerRegister &&
                         plan.owner_reg == 0 && !guards_null);
          }
          CPP
          # Also execute these game-logic assertions on the Linux host.
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -I "$src/src" \
            "$RUNNER_TEMP/game-port-probe.cpp" "$src/src/common/rcf.cpp" \
            -shared -fPIC -o "$RUNNER_TEMP/libhulkpocket-host-probe.so"
          python3 - "$RUNNER_TEMP/libhulkpocket-host-probe.so" <<'PY'
          import ctypes
          import sys
          lib = ctypes.CDLL(sys.argv[1])
          assert lib.hulkpocket_game_code_probe() == 1, "Portable gameplay probe failed"
          PY
          "$bin/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC \
            -Wall -Wextra -Werror -I "$src/src" \
            -c "$RUNNER_TEMP/game-port-probe.cpp" -o "$RUNNER_TEMP/hulk-game-port-probe.o"
          "$bin/aarch64-linux-android29-clang++" -shared \
            -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            "$RUNNER_TEMP/hulk-game-port-probe.o" "$RUNNER_TEMP/hulk-rcf.o" \
            -o "$RUNNER_TEMP/libhulkpocket-game-port-probe.so"
          "$bin/llvm-readelf" -h "$RUNNER_TEMP/libhulkpocket-game-port-probe.so" > "$RUNNER_TEMP/game-elf.txt"
          grep -q 'AArch64' "$RUNNER_TEMP/game-elf.txt"
          grep -q 'ELF64' "$RUNNER_TEMP/game-elf.txt"
          "$bin/llvm-nm" -D "$RUNNER_TEMP/libhulkpocket-game-port-probe.so" > "$RUNNER_TEMP/game-symbols.txt"
          grep -q hulkpocket_game_code_probe "$RUNNER_TEMP/game-symbols.txt"
          echo "Compiled real platform-independent Hulk Recompiled game logic and RCF archive code as Android ARM64 shared library." >> "$GITHUB_STEP_SUMMARY"
          echo "This is a game-source portability test, not a complete engine or playable APK." >> "$GITHUB_STEP_SUMMARY"
      # Do not distribute upstream binaries, copyrighted assets, or recompiled game image.

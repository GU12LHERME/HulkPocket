      - name: Prepare SDK-generated Xbox C++ for Android ELF and verify exports
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_prepare_xbe_elf.py' -v
          python3 -m unittest discover -s tools -p 'test_audit_xbe_elf.py' -v
          python3 -m unittest discover -s tools -p 'test_recompile_hulk_local.py' -v
          python3 -m unittest discover -s tools -p 'test_create_synthetic_xbe_recompile.py' -v
          # Artificial generated code uses real SDK headers/export conventions.
          # NO game image or actual Hulk executable is included.
          gen="$RUNNER_TEMP/xbe-generated"
          mkdir -p "$gen"
          cat > "$gen/x86_recomp_shared.h" <<'CPP'
          #pragma once
          #include "cpu/x86_ops.h"
          X86_EXTERN_FUNC(sub_00300010);
          X86_EXTERN_FUNC(sub_00300020);
          CPP
          cat > "$gen/x86_recomp.0.cpp" <<'CPP'
          #include "x86_recomp_shared.h"
          X86_FUNC(sub_00300010) {
              ctx.eax = uint32_t(base[0]) + 0x1234;
          }
          X86_FUNC(sub_00300020) {
              (void)base;
              ctx.ebx = 0xCAFE;
          }
          CPP
          cat > "$gen/x86_func_mapping.cpp" <<'CPP'
          #include "x86_recomp_shared.h"
          const uint32_t X86CodeBase = 0x300000;
          const uint32_t X86CodeEnd = 0x310000;
          const uint32_t X86ImageBase = 0x10000;
          const uint32_t X86ImageEnd = 0x400000;
          const uint32_t X86EntryPoint = 0x300010;
          const uint32_t X86KernelThunk = 0xF000;
          const X86FuncMapping X86FuncMappings[] = {
              {0x300010, sub_00300010},
              {0x300020, sub_00300020},
              {0, nullptr},
          };
          const uint32_t X86Continuations[] = {0};
          // Exercise the SDK's Windows /alternatename/ replacement
          // with the Android ELF weak alias for an absent function.
          X86_FUNC(__imp__sub_00300030) {
              (void)base;
              ctx.eax = 0x30;
          }
          X86_WEAK_FUNC(sub_00300030, __imp__sub_00300030)
          CPP
          python3 tools/prepare_xbe_elf.py \
            --sdk "$RUNNER_TEMP/xbe-sdk" --generated "$gen" \
            --output "$RUNNER_TEMP/xbe-elf"
          clang++ -std=c++20 -O2 -fPIC -shared -Wall -Wextra -Werror \
            -I "$RUNNER_TEMP/xbe-elf" \
            "$RUNNER_TEMP/xbe-elf/x86_func_mapping.cpp" \
            "$RUNNER_TEMP/xbe-elf/x86_recomp.0.cpp" \
            -o "$RUNNER_TEMP/libprepared-xbe-code-host.so"
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -I native -I "$RUNNER_TEMP/xbe-sdk/runtime" \
            native/test_portable_xbe_image.cpp native/portable_xbe_image.cpp \
            native/portable_xbe_dispatch.cpp -ldl \
            -o "$RUNNER_TEMP/test-prepared-xbe-code-host"
          "$RUNNER_TEMP/test-prepared-xbe-code-host" "$RUNNER_TEMP/libprepared-xbe-code-host.so"
          bin="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$bin/aarch64-linux-android29-clang++" -std=c++20 -O2 -fPIC -shared \
            -Wall -Wextra -Werror -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            -I "$RUNNER_TEMP/xbe-elf" \
            "$RUNNER_TEMP/xbe-elf/x86_func_mapping.cpp" \
            "$RUNNER_TEMP/xbe-elf/x86_recomp.0.cpp" \
            -o "$RUNNER_TEMP/libprepared-xbe-code-android.so"
          "$bin/llvm-readelf" -h "$RUNNER_TEMP/libprepared-xbe-code-android.so" | grep -q AArch64
          "$bin/llvm-nm" -D "$RUNNER_TEMP/libprepared-xbe-code-android.so" |
            grep 'X86FuncMappings'
          # Full reusable local build command. Compiles each generated
          # partition independently and refuses unresolved host imports.
          python3 tools/build_xbe_android.py \
            --sdk "$RUNNER_TEMP/xbe-sdk" \
            --generated "$gen" \
            --ndk-bin "$bin" \
            --audit-output "$RUNNER_TEMP/hulk-undefined-imports.json" \
            --output "$RUNNER_TEMP/libprepared-xbe-code-local-build.so"
          python3 -m json.tool "$RUNNER_TEMP/hulk-undefined-imports.json" > /dev/null
          "$bin/llvm-nm" -D "$RUNNER_TEMP/libprepared-xbe-code-local-build.so" |
            grep 'X86EntryPoint'
          echo "Verified generated-style C++ as an exported Android ARM64 ELF module (synthetic game code)." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout playable Windows port as build input

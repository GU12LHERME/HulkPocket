name: Android ARM64 smoke
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test XISO extraction
        run: python3 -m unittest discover -s tools -p 'test_xiso.py' -v
      - name: Install NDK
        run: |
          set -eu
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o "$RUNNER_TEMP/ndk.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
      - name: Compile and inspect ARM64 ELF
        run: |
          set -eu
          TOOL="$RUNNER_TEMP/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p build
          "$TOOL/aarch64-linux-android24-clang++" -std=c++17 -O2 -Wall -Wextra -Werror native/smoke.cpp -o build/hulkpocket-smoke
          "$TOOL/llvm-readelf" -h build/hulkpocket-smoke | tee build/elf.txt
          grep -q AArch64 build/elf.txt
          grep -q ELF64 build/elf.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-smoke
          path: build/

name: Thunderclap Android SDL3 dependency smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/thunderclap-sdl3.yml'
permissions:
  contents: read

jobs:
  sdl3-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android ARM64 build tools
        run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install host build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: Check out upstream for isolated dependency build
        run: |
          set -euo pipefail
          # Pinned upstream revision validated locally (tools/run_ci_local.py).
          THUNDERCLAP_REV=f6ead5c8ad63fde00786aad0aeaacba0e8000f9a
          git init -q "$RUNNER_TEMP/thunderclap"
          git -C "$RUNNER_TEMP/thunderclap" fetch -q --depth 1 https://github.com/matthewfcarlson/thunderclap.git "$THUNDERCLAP_REV"
          git -C "$RUNNER_TEMP/thunderclap" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/thunderclap" rev-parse HEAD)" = "$THUNDERCLAP_REV"
          git -C "$RUNNER_TEMP/thunderclap" rev-parse HEAD
      - name: Fetch pinned SDL3 sources
        working-directory: ${{ runner.temp }}/thunderclap
        run: python3 tools/wine_sdl.py fetch
      - name: Compile and validate SDL3 Android ARM64 app backend
        working-directory: ${{ runner.temp }}/thunderclap
        run: |
          set -euo pipefail
          export HULK_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          python3 tools/native_android_sdl.py --config app --jobs 2
          lib=build/third_party/out/sdl-android-arm64-app/lib/libSDL3.a
          test -s "$lib"
          test -f build/third_party/out/sdl-android-arm64-app/include/SDL3/SDL.h
          ar="$HULK_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          "$ar" t "$lib" > "$RUNNER_TEMP/sdl-objects.txt"
          grep -Eq '[.]o$' "$RUNNER_TEMP/sdl-objects.txt"
          # Confirm SDL3 and the Android NDK can link an actual shared object,
          # not merely archive C++ objects.
          cat > "$RUNNER_TEMP/sdl-link-smoke.cpp" <<'CPP'
          #include <SDL3/SDL.h>
          extern "C" int hulkpocket_sdl_link_smoke() {
              bool initialized = SDL_Init(SDL_INIT_VIDEO | SDL_INIT_AUDIO);
              if (initialized) SDL_Quit();
              return initialized ? 1 : 0;
          }
          CPP
          ndkbin="$HULK_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndkbin/aarch64-linux-android29-clang++" \
            -std=c++17 -fPIC -shared -Wl,-z,defs \
            -I build/third_party/out/sdl-android-arm64-app/include \
            "$RUNNER_TEMP/sdl-link-smoke.cpp" "$lib" \
            -landroid -llog -lOpenSLES -lEGL -lGLESv2 -lm -o "$RUNNER_TEMP/libhulkpocket-sdl-smoke.so"
          "$ndkbin/llvm-readelf" -h "$RUNNER_TEMP/libhulkpocket-sdl-smoke.so" | grep -q AArch64
          sha256sum "$lib"
          echo 'SDL3 Android ARM64 app archive built and checked.' >> "$GITHUB_STEP_SUMMARY"
      # No copyrighted game files or compiled binaries uploaded.

name: XBE Vulkan renderer experiment
on:
  push:
    branches: [experiment-vulkan-runtime]
    paths:
      - 'native/vulkan_experiment/**'
      - 'third_party/scda-vulkan/**'
      - 'third_party/xboxxberecomp/gpu/**'
      - '.github/workflows/xbe-vulkan-experiment.yml'
  workflow_dispatch:
jobs:
  shader-and-lifetime:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: /tmp/hulk-ci-ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan headers and validator
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers spirv-tools ninja-build ccache
      - name: Restore compiler object cache
        uses: actions/cache@v4
        with:
          path: /tmp/hulk-ci-ccache
          key: hulk-vulkan-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hulk-vulkan-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Fetch pinned Xbox runtime ABI header
        run: |
          mkdir -p /tmp/hulk-sdk/cpu
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/TGP482/XboxXBERecomp/767a81837fba2d86913f6af81a10b33661d35518/runtime/cpu/x86_context.h -o /tmp/hulk-sdk/cpu/x86_context.h
          test "$(git hash-object /tmp/hulk-sdk/cpu/x86_context.h)" = a02e10b8e2069920529d79d1f4e2413c73cb5f10
      - name: Build upstream reference and Hulk shader compiler
        run: |
          cmake -S native/vulkan_experiment -B /tmp/hulk-vk -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DHULK_SDK_DIR=/tmp/hulk-sdk
          cmake --build /tmp/hulk-vk --parallel 2
      - name: Run reference tests, shader compiler and real offscreen Vulkan draws
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          test -n "$VK_ICD_FILENAMES"
          ctest --test-dir /tmp/hulk-vk --output-on-failure --verbose
      - name: Validate emitted Vulkan SPIR-V
        run: |
          test -f /tmp/hulk-vk/spv/packed-lit.vert.spv
          for f in /tmp/hulk-vk/spv/*.spv; do spirv-val --target-env vulkan1.1 "$f"; done
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Compile the same pixel probe for Android ARM64
        run: |
          sdkmanager 'ndk;28.2.13676358'
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p /tmp/hulk-vk/android-probe/spv
          cmake -S native/vulkan_experiment -B /tmp/hulk-vk-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DHULK_SDK_DIR=/tmp/hulk-sdk -DBUILD_SHARED_LIBS=OFF -DFETCHCONTENT_SOURCE_DIR_GLSLANG=/tmp/hulk-vk/_deps/glslang-src
          cmake --build /tmp/hulk-vk-android --target hulk_vulkan_offscreen --parallel 2
          cp /tmp/hulk-vk-android/hulk_vulkan_offscreen /tmp/hulk-vk/android-probe/hulk-vulkan-probe
          "$ndk/llvm-readelf" -h /tmp/hulk-vk/android-probe/hulk-vulkan-probe | grep AArch64 >/dev/null
          cp /tmp/hulk-vk/spv/*.spv /tmp/hulk-vk/android-probe/spv/
          cp native/vulkan_experiment/run_android_probe.sh /tmp/hulk-vk/android-probe/
          cp third_party/scda-vulkan/LICENSE /tmp/hulk-vk/android-probe/LICENSE-SCDA
      - uses: actions/upload-artifact@v4
        with:
          name: HulkPocket-Vulkan-RP6-probe-arm64
          path: /tmp/hulk-vk/android-probe/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hulk-vulkan-shader-probe
          path: /tmp/hulk-vk/spv
          if-no-files-found: ignore

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats || true

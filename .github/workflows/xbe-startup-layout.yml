name: XBE startup layout
on:
  push:
    branches: [experiment-xbe-recomp-android]
    paths:
      - 'native/hulk_xbe_local_diagnostic.cpp'
      - 'tools/run_hulk_diagnostic.sh'
      - 'native/portable_xbe_image.*'
      - 'native/xbe_first_entry_probe.cpp'
      - 'native/xbe_graphics_boundary.h'
      - 'native/xbe_d3d8_entry_guard.cpp'
      - 'native/test_xbe_graphics_boundary.cpp'
      - 'tools/link_hulk_cached.py'
      - 'tools/report_hulk_allocator.py'
      - 'tools/report_missing_guest.py'
      - 'tools/supplemental_guest_mapping.py'
      - 'tools/extend_hulk_generated.py'
      - 'tools/discover_hulk_xpp.py'
      - 'tools/run_hulk_next.sh'
      - 'native/test_xbe_supplemental_mapping.cpp'
      - 'native/portable_xbe_dispatch.cpp'
      - 'native/xbe_diagnostic_runtime.cpp'
      - 'native/portable_xbe_cpu_services.*'
      - 'native/xbe_guest_cpu_primitives.h'
      - 'native/test_xbe_diagnostic_cpu.cpp'
      - 'native/xbe_guest_thread_exit.h'
      - 'native/*xbe_fault_diagnostic*'
      - 'native/*xbe_kernel*'
      - 'native/hulk_kernel*'
      - 'third_party/xboxxberecomp/**'
      - 'native/test_xbe_gpu_shader_foundation.cpp'
      - 'native/test_xbe_gpu_resources.cpp'
      - 'native/xbe_d3d8_bridge.h'
      - 'native/test_xbe_d3d8_bridge.cpp'
      - 'native/xbe_initial_cpu.h'
      - 'native/xbe_tls_index.h'
      - 'native/*xbe_entry_session*'
      - 'native/xbe_startup_layout.h'
      - 'native/xbe_tls.h'
      - 'native/xbe_bootstrap.h'
      - 'native/test_xbe_bootstrap.cpp'
      - 'native/test_xbe_tls.cpp'
      - 'native/xbe_startup_memory.h'
      - 'native/test_xbe_startup_memory.cpp'
      - 'native/xbox_guest_address_space.*'
      - 'native/test_xbe_startup_layout.cpp'
      - 'native/xbe_image_memory_loader.h'
      - '.github/workflows/xbe-startup-layout.yml'
  workflow_dispatch:
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned SDK context
        run: |
          mkdir -p /tmp/hulk-sdk/cpu
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/TGP482/XboxXBERecomp/767a81837fba2d86913f6af81a10b33661d35518/runtime/cpu/x86_context.h -o /tmp/hulk-sdk/cpu/x86_context.h
          test "$(git hash-object /tmp/hulk-sdk/cpu/x86_context.h)" = a02e10b8e2069920529d79d1f4e2413c73cb5f10
      - name: Validate local diagnostic script
        run: |
          bash -n tools/run_hulk_diagnostic.sh
          bash -n tools/run_hulk_next.sh
      - name: Verify strong generated graphics override
        run: |
          printf '#define HAS_Direct3D_CreateDevice 1\n#define SYM_Direct3D_CreateDevice 0037D900\n#define HAS_XLaunchNewImageA 1\n#define SYM_XLaunchNewImageA 00209C04\n' > /tmp/hulk-sdk/image_symbols.h
          g++ -std=c++17 -Wall -Wextra -Werror -I/tmp/hulk-sdk native/test_xbe_graphics_boundary.cpp native/xbe_d3d8_entry_guard.cpp -o /tmp/graphics-boundary
          /tmp/graphics-boundary
          nm /tmp/graphics-boundary | grep ' T sub_0037D900$'
          nm /tmp/graphics-boundary | grep ' T sub_00209C04$'
          python3 -m py_compile tools/link_hulk_cached.py tools/report_hulk_allocator.py
          python3 tools/report_hulk_allocator.py --self-test
          python3 tools/report_missing_guest.py --self-test
          python3 tools/supplemental_guest_mapping.py --self-test
          python3 tools/extend_hulk_generated.py --self-test
          python3 tools/discover_hulk_xpp.py --self-test
      - name: Host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror native/test_xbe_startup_layout.cpp -o /tmp/layout
          /tmp/layout
          g++ -std=c++17 -Wall -Wextra -Werror native/test_xbe_startup_memory.cpp native/xbox_guest_address_space.cpp -o /tmp/startup-memory
          /tmp/startup-memory
          g++ -std=c++17 -Wall -Wextra -Werror native/test_xbe_tls.cpp native/xbox_guest_address_space.cpp -o /tmp/tls
          /tmp/tls
          g++ -std=c++17 -Wall -Wextra -Werror native/test_xbe_bootstrap.cpp native/xbox_guest_address_space.cpp -o /tmp/bootstrap
          /tmp/bootstrap
          g++ -std=c++17 -Wall -Wextra -Werror native/test_xbe_kernel_bindings.cpp native/xbe_kernel_imports.cpp native/xbox_guest_address_space.cpp -o /tmp/bindings
          /tmp/bindings
          g++ -std=c++17 -Wall -Wextra -Werror -I/tmp/hulk-sdk native/test_xbe_entry_session.cpp native/xbe_kernel_imports.cpp native/xbox_guest_address_space.cpp -pthread -Ithird_party/xboxxberecomp third_party/xboxxberecomp/kernel/crypto.cpp -o /tmp/entry-session
          /tmp/entry-session
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -I/tmp/hulk-sdk native/test_xbe_kernel_session.cpp native/xbox_guest_address_space.cpp -Ithird_party/xboxxberecomp third_party/xboxxberecomp/kernel/crypto.cpp -o /tmp/kernel-session
          timeout 20 /tmp/kernel-session
          g++ -std=c++17 -Wall -Wextra -Werror native/test_xbe_fault_diagnostic.cpp native/xbox_guest_address_space.cpp -o /tmp/fault-diagnostic
          /tmp/fault-diagnostic
          g++ -std=c++17 -Wall -Wextra -Werror -I/tmp/hulk-sdk native/test_xbe_diagnostic_cpu.cpp native/xbe_diagnostic_runtime.cpp native/portable_xbe_dispatch.cpp -o /tmp/diagnostic-cpu
          /tmp/diagnostic-cpu
          g++ -std=c++17 -Wall -Wextra -Werror native/test_xbe_kernel_data.cpp native/xbox_guest_address_space.cpp -o /tmp/kernel-data
          /tmp/kernel-data
          g++ -std=c++20 -O2 -Ithird_party/xboxxberecomp native/test_xbe_gpu_shader_foundation.cpp third_party/xboxxberecomp/gpu/shaders.cpp -o /tmp/gpu-shaders
          /tmp/gpu-shaders
          g++ -std=c++20 -O2 -Ithird_party/xboxxberecomp native/test_xbe_gpu_resources.cpp native/xbox_guest_address_space.cpp third_party/xboxxberecomp/gpu/texture.cpp third_party/xboxxberecomp/gpu/vertex.cpp -o /tmp/gpu-resources
          /tmp/gpu-resources
          g++ -std=c++20 -O2 -pthread -I/tmp/hulk-sdk -Ithird_party/xboxxberecomp native/test_xbe_d3d8_bridge.cpp native/xbox_guest_address_space.cpp third_party/xboxxberecomp/gpu/texture.cpp third_party/xboxxberecomp/gpu/vertex.cpp -o /tmp/d3d8-bridge
          /tmp/d3d8-bridge
          g++ -std=c++17 -Wall -Wextra -Werror -I/tmp/hulk-sdk -c native/portable_xbe_image.cpp -o /tmp/portable_xbe_image.o
          g++ -std=c++17 -Wall -Wextra -Werror -I/tmp/hulk-sdk -c native/xbe_first_entry_probe.cpp -o /tmp/xbe_first_entry_probe.o
          mkdir -p /tmp/hulk-extra-test
          python3 tools/supplemental_guest_mapping.py --fixture /tmp/hulk-extra-test
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -I/tmp/hulk-sdk -I/tmp/hulk-extra-test native/test_xbe_supplemental_mapping.cpp native/xbe_first_entry_probe.cpp native/portable_xbe_dispatch.cpp -o /tmp/hulk-extra-test-host
          /tmp/hulk-extra-test-host
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -DHULK_ENABLE_ENTRY_DIAGNOSTIC -I/tmp/hulk-sdk native/hulk_xbe_local_diagnostic.cpp native/hulk_xbe_preflight.cpp native/xbox_guest_address_space.cpp native/xbe_image_memory_loader.cpp native/xbe_kernel_imports.cpp native/portable_xbe_image.cpp native/portable_xbe_dispatch.cpp -ldl -Ithird_party/xboxxberecomp third_party/xboxxberecomp/kernel/crypto.cpp -o /tmp/hulk-execute-diagnostic
      - name: Install ARM64 tools
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu qemu-user
      - name: ARM64 tests
        run: |
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror native/test_xbe_startup_layout.cpp -o /tmp/layout-arm64
          qemu-aarch64 /tmp/layout-arm64
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror native/test_xbe_startup_memory.cpp native/xbox_guest_address_space.cpp -o /tmp/startup-memory-arm64
          qemu-aarch64 /tmp/startup-memory-arm64
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror native/test_xbe_tls.cpp native/xbox_guest_address_space.cpp -o /tmp/tls-arm64
          qemu-aarch64 /tmp/tls-arm64
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror native/test_xbe_bootstrap.cpp native/xbox_guest_address_space.cpp -o /tmp/bootstrap-arm64
          qemu-aarch64 /tmp/bootstrap-arm64
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror native/test_xbe_kernel_bindings.cpp native/xbe_kernel_imports.cpp native/xbox_guest_address_space.cpp -o /tmp/bindings-arm64
          qemu-aarch64 /tmp/bindings-arm64
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror -I/tmp/hulk-sdk native/test_xbe_entry_session.cpp native/xbe_kernel_imports.cpp native/xbox_guest_address_space.cpp -pthread -Ithird_party/xboxxberecomp third_party/xboxxberecomp/kernel/crypto.cpp -o /tmp/entry-session-arm64
          qemu-aarch64 /tmp/entry-session-arm64
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror -pthread -I/tmp/hulk-sdk native/test_xbe_kernel_session.cpp native/xbox_guest_address_space.cpp -Ithird_party/xboxxberecomp third_party/xboxxberecomp/kernel/crypto.cpp -o /tmp/kernel-session-arm64
          timeout 20 qemu-aarch64 /tmp/kernel-session-arm64
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror native/test_xbe_fault_diagnostic.cpp native/xbox_guest_address_space.cpp -o /tmp/fault-diagnostic-arm64
          qemu-aarch64 /tmp/fault-diagnostic-arm64
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror -I/tmp/hulk-sdk native/test_xbe_diagnostic_cpu.cpp native/xbe_diagnostic_runtime.cpp native/portable_xbe_dispatch.cpp -o /tmp/diagnostic-cpu-arm64
          qemu-aarch64 /tmp/diagnostic-cpu-arm64
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror native/test_xbe_kernel_data.cpp native/xbox_guest_address_space.cpp -o /tmp/kernel-data-arm64
          qemu-aarch64 /tmp/kernel-data-arm64
          aarch64-linux-gnu-g++ -static -std=c++20 -O2 -Ithird_party/xboxxberecomp native/test_xbe_gpu_shader_foundation.cpp third_party/xboxxberecomp/gpu/shaders.cpp -o /tmp/gpu-shaders-arm64
          qemu-aarch64 /tmp/gpu-shaders-arm64
          aarch64-linux-gnu-g++ -static -std=c++20 -O2 -Ithird_party/xboxxberecomp native/test_xbe_gpu_resources.cpp native/xbox_guest_address_space.cpp third_party/xboxxberecomp/gpu/texture.cpp third_party/xboxxberecomp/gpu/vertex.cpp -o /tmp/gpu-resources-arm64
          qemu-aarch64 /tmp/gpu-resources-arm64
          aarch64-linux-gnu-g++ -static -std=c++20 -O2 -pthread -I/tmp/hulk-sdk -Ithird_party/xboxxberecomp native/test_xbe_d3d8_bridge.cpp native/xbox_guest_address_space.cpp third_party/xboxxberecomp/gpu/texture.cpp third_party/xboxxberecomp/gpu/vertex.cpp -o /tmp/d3d8-bridge-arm64
          qemu-aarch64 /tmp/d3d8-bridge-arm64
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror -I/tmp/hulk-sdk native/test_xbe_graphics_boundary.cpp native/xbe_d3d8_entry_guard.cpp -o /tmp/graphics-boundary-arm64
          qemu-aarch64 /tmp/graphics-boundary-arm64
          aarch64-linux-gnu-g++ -std=c++17 -Wall -Wextra -Werror -I/tmp/hulk-sdk -c native/portable_xbe_image.cpp -o /tmp/portable_xbe_image.o
          aarch64-linux-gnu-g++ -std=c++17 -Wall -Wextra -Werror -I/tmp/hulk-sdk -c native/xbe_first_entry_probe.cpp -o /tmp/xbe_first_entry_probe.o
          aarch64-linux-gnu-g++ -static -std=c++17 -Wall -Wextra -Werror -pthread -I/tmp/hulk-sdk -I/tmp/hulk-extra-test native/test_xbe_supplemental_mapping.cpp native/xbe_first_entry_probe.cpp native/portable_xbe_dispatch.cpp -o /tmp/hulk-extra-test-arm64
          qemu-aarch64 /tmp/hulk-extra-test-arm64
          aarch64-linux-gnu-g++ -std=c++17 -Wall -Wextra -Werror -pthread -DHULK_ENABLE_ENTRY_DIAGNOSTIC -I/tmp/hulk-sdk native/hulk_xbe_local_diagnostic.cpp native/hulk_xbe_preflight.cpp native/xbox_guest_address_space.cpp native/xbe_image_memory_loader.cpp native/xbe_kernel_imports.cpp native/portable_xbe_image.cpp native/portable_xbe_dispatch.cpp -ldl -Ithird_party/xboxxberecomp third_party/xboxxberecomp/kernel/crypto.cpp -o /tmp/hulk-execute-diagnostic

name: XBE GLES renderer smoke
on:
  push:
    branches: [experiment-xbe-recomp-android]
    paths:
      - 'native/*xbe_gles_backend*'
      - 'native/xbe_bc_decode.h'
      - 'native/xbe_d3d8_bridge.h'
      - 'native/xbe_d3d8_create_probe.h'
      - 'native/xbe_d3d8_device_memory.h'
      - 'native/xbe_nv2a_push.h'
      - 'native/xbe_d3d8_default_trace.h'
      - 'native/xbe_kernel_session.h'
      - 'native/hulk_sound.h'
      - 'native/test_hulk_sound.cpp'
      - 'third_party/xboxxberecomp/audio/**'
      - 'native/xbe_kernel_files.h'
      - 'native/hulk_live_fibers.h'
      - 'native/hulk_xdk_fiber_hook.h'
      - 'tools/install_hulk_diagnostic.py'
      - 'tools/run_hulk_diagnostic.sh'
      - 'native/xbox_guest_address_space.*'
      - 'third_party/xboxxberecomp/gpu/**'
      - '.github/workflows/xbe-gles-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test matching artifact installer
        run: python3 tools/test_install_hulk_diagnostic.py
      - name: Install Mesa
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri
      - name: Fetch SDK context
        run: |
          mkdir -p /tmp/hulk-sdk/cpu
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/TGP482/XboxXBERecomp/767a81837fba2d86913f6af81a10b33661d35518/runtime/cpu/x86_context.h -o /tmp/hulk-sdk/cpu/x86_context.h
          test "$(git hash-object /tmp/hulk-sdk/cpu/x86_context.h)" = a02e10b8e2069920529d79d1f4e2413c73cb5f10
      - name: Validate software DirectSound mixing and guest memory
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I/tmp/hulk-sdk native/test_hulk_sound.cpp native/xbox_guest_address_space.cpp -o /tmp/hulk-sound
          /tmp/hulk-sound
      - name: Compile and render with real GLES
        run: |
          g++ -std=c++20 -O2 -pthread -I/tmp/hulk-sdk -Ithird_party/xboxxberecomp native/test_xbe_gles_backend.cpp native/xbe_gles_backend.cpp native/xbox_guest_address_space.cpp third_party/xboxxberecomp/gpu/texture.cpp third_party/xboxxberecomp/gpu/vertex.cpp -lEGL -lGLESv2 -o /tmp/hulk-gles
          EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 /tmp/hulk-gles
          g++ -std=c++20 -O2 -pthread -DHULK_ENABLE_ENTRY_DIAGNOSTIC -DHULK_ENABLE_GLES_DEVICE_PROBE -I/tmp/hulk-sdk -Ithird_party/xboxxberecomp native/hulk_xbe_local_diagnostic.cpp native/hulk_xbe_preflight.cpp native/xbox_guest_address_space.cpp native/xbe_image_memory_loader.cpp native/xbe_kernel_imports.cpp native/portable_xbe_image.cpp native/portable_xbe_dispatch.cpp third_party/xboxxberecomp/kernel/crypto.cpp native/xbe_gles_backend.cpp third_party/xboxxberecomp/gpu/texture.cpp third_party/xboxxberecomp/gpu/vertex.cpp -ldl -lEGL -lGLESv2 -o /tmp/hulk-live-diagnostic
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fetch SDK context
        run: |
          mkdir -p /tmp/hulk-sdk/cpu
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/TGP482/XboxXBERecomp/767a81837fba2d86913f6af81a10b33661d35518/runtime/cpu/x86_context.h -o /tmp/hulk-sdk/cpu/x86_context.h
          test "$(git hash-object /tmp/hulk-sdk/cpu/x86_context.h)" = a02e10b8e2069920529d79d1f4e2413c73cb5f10
      - name: Compile Android ARM64 GLES diagnostic
        run: |
          set -eu
          NDK="$RUNNER_TEMP/android-ndk-r28c"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o "$RUNNER_TEMP/ndk.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p build/gles
          "$TOOL/aarch64-linux-android24-clang++" -std=c++20 -O2 -pthread -static-libstdc++ -I/tmp/hulk-sdk -Ithird_party/xboxxberecomp native/test_xbe_gles_backend.cpp native/xbe_gles_backend.cpp native/xbox_guest_address_space.cpp third_party/xboxxberecomp/gpu/texture.cpp third_party/xboxxberecomp/gpu/vertex.cpp -lEGL -lGLESv3 -o build/gles/hulk-gles-smoke
          "$TOOL/aarch64-linux-android24-clang++" -std=c++20 -O2 -pthread -static-libstdc++ -DHULK_ENABLE_ENTRY_DIAGNOSTIC -DHULK_ENABLE_GLES_DEVICE_PROBE -I/tmp/hulk-sdk -Ithird_party/xboxxberecomp native/hulk_xbe_local_diagnostic.cpp native/hulk_xbe_preflight.cpp native/xbox_guest_address_space.cpp native/xbe_image_memory_loader.cpp native/xbe_kernel_imports.cpp native/portable_xbe_image.cpp native/portable_xbe_dispatch.cpp third_party/xboxxberecomp/kernel/crypto.cpp native/xbe_gles_backend.cpp third_party/xboxxberecomp/gpu/texture.cpp third_party/xboxxberecomp/gpu/vertex.cpp -ldl -lEGL -lGLESv3 -o build/gles/hulk-live-diagnostic
          "$TOOL/llvm-readelf" -h -d build/gles/hulk-gles-smoke | tee build/gles/elf.txt
          grep -q AArch64 build/gles/elf.txt
          git rev-parse HEAD > build/gles/revision.txt
          (cd build/gles && sha256sum hulk-live-diagnostic > hulk-live-diagnostic.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hulk-gles-android-arm64
          path: build/gles/

name: Thunderclap Android FFmpeg dependency smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/thunderclap-ffmpeg.yml'

permissions:
  contents: read

concurrency:
  group: thunderclap-ffmpeg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ffmpeg-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make ninja-build pkg-config xz-utils
          python3 -m venv "$RUNNER_TEMP/ffmpeg-venv"
          "$RUNNER_TEMP/ffmpeg-venv/bin/python" -m pip install --disable-pip-version-check meson pkgconf
      - name: Checkout Thunderclap to temporary directory
        run: |
          # Pinned upstream revision validated locally (tools/run_ci_local.py).
          THUNDERCLAP_REV=f6ead5c8ad63fde00786aad0aeaacba0e8000f9a
          git init -q "$RUNNER_TEMP/thunderclap"
          git -C "$RUNNER_TEMP/thunderclap" fetch -q --depth 1 https://github.com/matthewfcarlson/thunderclap.git "$THUNDERCLAP_REV"
          git -C "$RUNNER_TEMP/thunderclap" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/thunderclap" rev-parse HEAD)" = "$THUNDERCLAP_REV"
          git -C "$RUNNER_TEMP/thunderclap" rev-parse HEAD | tee "$RUNNER_TEMP/upstream-sha.txt"
      - name: Build FFmpeg and dav1d for Android ARM64
        working-directory: ${{ runner.temp }}/thunderclap
        env:
          HULK_NDK: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          set -euo pipefail
          export HULK_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          "$RUNNER_TEMP/ffmpeg-venv/bin/python" tools/wine_ffmpeg.py build --target android-arm64
          prefix="build/third_party/out/ffmpeg-android-arm64/install/lib"
          llvm_readelf="$HULK_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for lib in libavcodec.so libavformat.so libavutil.so libswresample.so; do
            test -s "$prefix/$lib"
            "$llvm_readelf" -h "$prefix/$lib" | grep -q AArch64
            "$llvm_readelf" -h "$prefix/$lib" | grep -q ELF64
          done
          # Android build generates dav1d notice; invoke the shared FFmpeg notice helper explicitly.
          "$RUNNER_TEMP/ffmpeg-venv/bin/python" -c 'import sys; sys.path.insert(0, "tools"); import wine_ffmpeg; wine_ffmpeg.write_license_notice()'
          test -s build/third_party/out/LICENSES-DAV1D.txt
          test -s build/third_party/out/LICENSES-FFMPEG.txt
          "$llvm_readelf" -d "$prefix/libavcodec.so" | grep -q SONAME
          "$llvm_readelf" -h "$prefix/libavcodec.so" | tee "$RUNNER_TEMP/ffmpeg-elf.txt"
          # Verify the game-facing multimedia APIs link into an Android ARM64
          # shared object, not only that separate .so files have ELF headers.
          cat > "$RUNNER_TEMP/ffmpeg-link-smoke.c" <<'C'
          #include <libavcodec/avcodec.h>
          #include <libavformat/avformat.h>
          #include <libavutil/avutil.h>
          #include <libswresample/swresample.h>
          unsigned hulkpocket_media_link_smoke(void) {
              const AVCodec *codec = avcodec_find_decoder_by_name("bink");
              return (codec != 0) + avcodec_version() +
                     avformat_version() + avutil_version() + swresample_version();
          }
          C
          ndkbin="$HULK_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$ndkbin/aarch64-linux-android29-clang" \
            -fPIC -shared -Wl,-z,defs -Wl,-z,max-page-size=16384 \
            -I build/third_party/out/ffmpeg-android-arm64/install/include \
            "$RUNNER_TEMP/ffmpeg-link-smoke.c" -L "$prefix" \
            -lavformat -lavcodec -lavutil -lswresample \
            -o "$RUNNER_TEMP/libhulkpocket-media-smoke.so"
          "$llvm_readelf" -h "$RUNNER_TEMP/libhulkpocket-media-smoke.so" | grep -q AArch64
          "$llvm_readelf" -d "$RUNNER_TEMP/libhulkpocket-media-smoke.so" | grep -q NEEDED
          printf 'FFmpeg and dav1d Android ARM64 shared libraries compiled and inspected.\n' >> "$GITHUB_STEP_SUMMARY"
      # Never upload game code, game data, or upstream binaries to public artifacts.
